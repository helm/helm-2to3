version: 2
workflows:
  version: 2
  untagged-build:
    jobs:
      - lint
  tagged-build:
    jobs:
      - lint
jobs:
  lint:
    docker:
      - image: koalaman/shellcheck-alpine
    steps:
      - checkout
      - run:
          name: lint
          command: |
            shellcheck -x scripts/tag.sh
            shellcheck -x scripts/install_plugin.sh
